name: Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npx tsc
      - name: Check tests
        run: KEY="secret-key" npm -w @piny/tests run api
      - name: Check API server
        run: KEY="secret-key" npm -w @piny/api t
